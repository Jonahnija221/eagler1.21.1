<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Eaglercraft 1.21.1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }
        #loading-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e0e0e0;
            transition: opacity 0.5s ease;
        }
        #loading-screen.hidden { opacity: 0; pointer-events: none; }
        #loading-title {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
        }
        #loading-subtitle {
            font-size: 1rem;
            color: #8899aa;
            margin-bottom: 40px;
        }
        #progress-container {
            width: 400px;
            max-width: 80vw;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        #loading-status {
            margin-top: 16px;
            font-size: 0.85rem;
            color: #667788;
            max-width: min(920px, 90vw);
            max-height: 45vh;
            overflow: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <div id="loading-screen">
        <div id="loading-title">EAGLERCRAFT</div>
        <div id="loading-subtitle">Minecraft 1.21.1 &mdash; Browser Edition</div>
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="loading-status">Initializing WebGL...</div>
    </div>

    <!-- Offline asset payload (generated by pack_assets.py) -->
    <!-- If not present, the game will fallback to HTTP XHR if hosted on a server -->
    <script>
        function onAssetsError() {
            if (window.location.protocol === 'file:') {
                document.getElementById('loading-status').textContent = 'ERROR: For offline mode, you must run pack_assets.py first!';
                document.getElementById('loading-title').textContent = 'ASSET ERROR';
            }
        }
    </script>
    <script src="assets.js" onerror="onAssetsError()"></script>
    <script>
        window.__eaglerRawImages = window.__eaglerRawImages || {};
        if ((window.location.search || '').indexOf('rawpng') >= 0) {
            document.write('<script src="assets_raw.js"><\\/script>');
        }
    </script>

    <!-- WebGL bridge must load before TeaVM bundle -->
    <script src="js/eaglercraft-webgl.js"></script>
    <script>
        // Initialize canvas and WebGL context
        (function() {
            var canvas = document.getElementById('game-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            window.addEventListener('resize', function() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });

            // Initialize WebGL
            var gl = window.__eaglerInitGL(canvas);
            if (gl) {
                document.getElementById('loading-status').textContent = 'Loading game...';
                document.getElementById('progress-bar').style.width = '20%';

                // Clear to Mojang red to prove WebGL works
                gl.clearColor(0.87, 0.17, 0.17, 1.0);
                gl.clear(gl.COLOR_BUFFER_BIT);
            } else {
                document.getElementById('loading-status').textContent = 'ERROR: WebGL not supported!';
                document.getElementById('loading-title').textContent = 'ERROR';
            }

            // Disable context menu on canvas
            canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        })();

        // Update loading progress
        window.__eaglerSetProgress = function(pct, msg) {
            var bar = document.getElementById('progress-bar');
            var status = document.getElementById('loading-status');
            if (bar) bar.style.width = pct + '%';
            if (status && msg) status.textContent = msg;
        };
        (function() {
            var search = window.location.search || '';
            window.__eaglerTracePng = search.indexOf('tracepng') >= 0;
            window.__eaglerTraceTextures = search.indexOf('tracetex') >= 0;
            window.__eaglerTraceGL = search.indexOf('tracegl') >= 0;
        })();
        window.__eaglerHideLoading = function() {
            var el = document.getElementById('loading-screen');
            if (el) el.classList.add('hidden');
        };
        window.__eaglerPredecodeImages = async function() {
            window.__eaglerRawImages = window.__eaglerRawImages || {};
        };
    </script>
    <script src="js/eaglercraft-input.js"></script>

    <script>
        (function() {
            function loadGameBundle() {
                window.__eaglerSetProgress(24, 'Loading game bundle...');
                var script = document.createElement('script');
                script.src = 'js/eaglercraft-1.21.js';
                script.onload = runGame;
                script.onerror = function() {
                    document.getElementById('loading-title').textContent = 'STARTUP ERROR';
                    document.getElementById('loading-status').textContent = 'Could not load TeaVM game bundle';
                };
                document.body.appendChild(script);
            }

            function runGame() {
                if (typeof window.main === 'function') {
                    window.__eaglerPredecodeImages().then(function() {
                        try {
                            window.__eaglerSetProgress(35, 'Starting game...');
                            window.main([]);
                        } catch (err) {
                            console.error('[Eaglercraft] Game startup failed', err);
                            document.getElementById('loading-title').textContent = 'STARTUP ERROR';
                            document.getElementById('loading-status').textContent = formatStartupError(err);
                        }
                    }).catch(function(err) {
                        console.error('[Eaglercraft] Game startup failed', err);
                        document.getElementById('loading-title').textContent = 'STARTUP ERROR';
                        document.getElementById('loading-status').textContent = formatStartupError(err);
                    });
                } else {
                    console.error('[Eaglercraft] TeaVM main export was not found');
                    document.getElementById('loading-title').textContent = 'STARTUP ERROR';
                    document.getElementById('loading-status').textContent = 'TeaVM main export was not found';
                }
            }

            requestAnimationFrame(function() {
                requestAnimationFrame(loadGameBundle);
            });

            function formatStartupError(err) {
                var lines = [];
                var seen = [];
                var current = err;
                var depth = 0;
                while (current && seen.indexOf(current) === -1 && depth < 8) {
                    seen.push(current);
                    if (depth > 0) lines.push('');
                    lines.push((depth === 0 ? 'Error' : 'Caused by') + ': ' + describeError(current));
                    if (current.stack) lines.push(current.stack);
                    current = current.cause;
                    depth++;
                }
                return lines.join('\n');
            }

            function describeError(err) {
                if (!err) return String(err);
                var name = err.name || (err.constructor && err.constructor.name) || 'Error';
                var message = err.message || String(err);
                return message && message.indexOf(name + ':') === 0 ? message : name + ': ' + message;
            }
        })();
    </script>
</body>
</html>
